services:
  vector:
    image: timberio/vector:0.54.0-alpine
    volumes:
      - ./data:/var/lib/vector
      - ./vector.toml:/etc/vector/vector.toml:ro
      - ./pipe.log:/etc/vector/pipe.log
    command: ["--config", "/etc/vector/vector.toml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
